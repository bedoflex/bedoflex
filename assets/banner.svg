<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="bedoflex Development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#16090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#e11d2e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e11d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d2e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e11d2e"/>
      <stop offset="1" stop-color="#e11d2e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .title{font-size:64px;font-weight:800;fill:#f5f5f7;letter-spacing:-1px}
      .red{fill:#e11d2e}
      .sub{font-size:20px;font-weight:500;fill:#a1a1aa;letter-spacing:4px}
      .tag{font-size:14px;font-weight:600;fill:#f5f5f7;letter-spacing:1px}
      .fade{animation:in .9s ease-out both}
      .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      .scan{animation:scan 4s linear infinite}
      @keyframes scan{from{transform:translateX(-700px)}to{transform:translateX(1200px)}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#e11d2e" stroke-opacity="0.25"/>

  <!-- left accent bar -->
  <rect x="64" y="86" width="5" height="148" rx="2.5" class="red"/>

  <g class="t">
    <g class="fade d1">
      <circle cx="98" cy="102" r="5" class="red pulse"/>
      <text x="112" y="108" class="sub">FIVEM SCRIPT DEVELOPER</text>
    </g>
    <text x="92" y="182" class="title fade d2">bedoflex<tspan class="red">.</tspan>dev</text>
    <text x="94" y="226" class="sub fade d3" style="letter-spacing:1px;font-size:19px">Modern, optimized &amp; escrow-ready FiveM resources</text>
  </g>

  <!-- right chips -->
  <g class="t fade d3">
    <g transform="translate(880 92)">
      <rect width="250" height="40" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#e11d2e" stroke-opacity="0.4"/>
      <circle cx="22" cy="20" r="4" class="red"/>
      <text x="38" y="25" class="tag">LUA · JS · VUE · NUI</text>
    </g>
    <g transform="translate(880 142)">
      <rect width="250" height="40" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#e11d2e" stroke-opacity="0.4"/>
      <circle cx="22" cy="20" r="4" class="red"/>
      <text x="38" y="25" class="tag">TEBEX · ESCROW</text>
    </g>
    <g transform="translate(880 192)">
      <rect width="250" height="40" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#e11d2e" stroke-opacity="0.4"/>
      <circle cx="22" cy="20" r="4" class="red"/>
      <text x="38" y="25" class="tag">FULL DOCS · GITBOOK</text>
    </g>
  </g>

  <!-- bottom scan line -->
  <rect x="0" y="286" width="1200" height="1" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="0" y="285" width="700" height="3" fill="url(#line)" class="scan"/>
</svg>
